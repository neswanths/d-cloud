---
# D-Cloud hApp Manifest — Holochain 0.3.6
manifest_version: "1"
name: d-cloud
description: >
  Decentralised cloud storage powered by Holochain. Files are split into
  AES-256-GCM encrypted chunks distributed across a peer-to-peer DHT.
  Only the recipient with the correct X25519 private key can decrypt.

roles:
  - name: file_storage
    provisioning:
      strategy: create
      deferred: false
    dna:
      bundled: "dnas/file_storage/workdir/file_storage.dna"
      modifiers:
        network_seed: ~
        properties: ~
